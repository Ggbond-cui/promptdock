# PromptDock 提示词库
# 修改并保存后自动生效。完整字段说明见项目 docs/spec.md 第 6.2 节。
version: 1

settings:
  hotkeys:
    prompt_panel: "option+space"         # 呼出 Prompt 面板
    action_panel: "option+shift+space"   # 呼出选中文字动作面板
  paste:
    restore_clipboard: true              # 粘贴后恢复原剪贴板内容
    restore_delay_ms: 500
  llm:
    provider: claude                     # 默认服务；单条 action 可用 provider / model 字段覆盖
    effort: medium                       # Anthropic 官方接口的思考深度：low / medium / high / xhigh / max
  # 模型服务。名字自己取；API Key 在菜单栏 → API Key 中按服务设置，存系统钥匙串
  # base_url：anthropic 协议不带 /v1，openai 协议照抄服务商文档
  providers:
    claude:
      protocol: anthropic
      base_url: https://api.anthropic.com
      model: claude-opus-5-5
    deepseek:
      protocol: openai
      base_url: https://api.deepseek.com
      model: deepseek-flash              # 另有 deepseek-v4-pro
      extra_body:                        # 合并进请求体的额外字段
        thinking:
          type: disabled                 # 改写类任务关闭思考，速度更快
    ollama:                              # 本地模型，无需 Key
      protocol: openai
      base_url: http://localhost:11434/v1
      model: qwen3
      extra_body:
        reasoning_effort: none           # 关闭 Qwen3 思考（实测首字 24.7s → 0.9s）；think: false 在该接口无效
  # network:
  #   proxy: "http://127.0.0.1:7890"     # 不写则跟随系统代理

prompts:
  # snippet：选中后直接粘贴 content
  - id: code-review                      # 唯一且稳定，使用统计按 id 关联
    title: 代码审查
    type: snippet
    keywords: [review, cr, 审查]
    tags: [dev]
    content: |
      请从正确性、可读性、性能三个方面审查以下代码，按严重程度排序列出问题，并给出修改建议：

  - id: explain-zh
    title: 用中文解释
    keywords: [explain, 解释]
    content: |
      请用中文解释下面的内容，先给一句话结论，再分点说明，专业名词第一次出现时给出解释：

  - id: evidence-first
    title: 先看证据再下结论
    keywords: [evidence, 证据]
    content: |
      有不确定的点先看代码；如果代码中没有依据，就停下来问我，不要做没有依据的推测。推断必须明确标注为推断。

  # {{说明}} 是占位符：粘贴后光标停在第一个占位符并选中，直接输入即可替换
  - id: slow-pr
    title: 慢 PR 分析
    keywords: [pr, 性能]
    content: |
      分析最近 {{7}} 天里最慢的 PR，找出可以优化的地方。

  # action：选中文字后按 ⌥⇧Space 执行。{selection} 会被替换为选中的文字
  # output：replace 回车替换原文（默认）/ copy 完成后自动复制 / show 只显示
  - id: polish-zh
    title: 中文润色
    type: action
    keywords: [润色, polish]
    system: 你是一名中文技术编辑。
    content: |
      润色下面这段文字，保持原意，书面、克制，无翻译腔：
      {selection}
    output: replace
