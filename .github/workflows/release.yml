name: release

# 推送 v* 标签时自动编译通用二进制、打包 dmg 并发布到 GitHub Release：
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 构建号按提交数计算，需要完整历史

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build dmg
        run: make dmg VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/PromptDock-*.dmg \
            --title "PromptDock ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --generate-notes
